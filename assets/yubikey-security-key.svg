<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#1f232b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9be36b"/><stop offset="0.6" stop-color="#5cb85c"/><stop offset="1" stop-color="#2e7d32"/>
    </radialGradient>
  </defs>
  <!-- USB connector -->
  <rect x="24" y="2" width="16" height="14" rx="2" fill="#c9ced6" stroke="#8c939e" stroke-width="1.5"/>
  <rect x="28" y="6" width="3" height="4" fill="#5d6470"/><rect x="33" y="6" width="3" height="4" fill="#5d6470"/>
  <!-- key body -->
  <rect x="14" y="14" width="36" height="44" rx="9" fill="url(#body)" stroke="#0f1115" stroke-width="1.5"/>
  <!-- keyring hole -->
  <circle cx="32" cy="50" r="4" fill="#0f1115" stroke="#4a505c" stroke-width="1.5"/>
  <!-- touch contact -->
  <circle cx="32" cy="32" r="9" fill="url(#glow)" stroke="#1b5e20" stroke-width="1.5"/>
  <circle cx="29" cy="29" r="3" fill="#ffffff" opacity="0.35"/>
</svg>
